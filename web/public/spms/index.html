<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">

  <link rel="apple-touch-icon" href="icon-192.png">

  <title>KebunRakyat SPMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
:root{--pri:#1f5132;--pri2:#2f7a4b;--acc:#c9a227;--bg:#f5f7f4;--card:#fff;--tx:#1b2620;--mut:#66736b;--bd:#e2e8e3;--ok:#2e8b57;--warn:#d98e04;--bad:#c0392b;--info:#2471a3;
--r:14px;--sh:0 1px 2px rgba(16,40,24,.06),0 4px 16px rgba(16,40,24,.06);--side:248px;--hdr:58px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[data-mode=dark]{--bg:#0f1713;--card:#17221c;--tx:#e6efe9;--mut:#9aaba1;--bd:#26352c;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
a{color:var(--pri2)}.hidden{display:none!important}.muted{color:var(--mut)}.tiny{font-size:12px}.err{color:var(--bad);min-height:1.2em;font-size:13px}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.2}h2{font-size:20px}h3{font-size:16px}
/* splash */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:99}
.sp-bar{width:140px;height:4px;border-radius:4px;background:var(--bd);overflow:hidden}.sp-bar i{display:block;height:100%;width:40%;background:var(--pri);animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--pri) 30%,transparent),transparent),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--acc) 25%,transparent),transparent),var(--bg)}
.lg-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:28px;text-align:center}
.lg-logo{width:76px;height:76px;object-fit:contain;border-radius:18px;background:color-mix(in srgb,var(--pri) 10%,transparent);cursor:zoom-in}
#lgForm{text-align:left;margin-top:14px}label{display:block;font-weight:500;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 40%,transparent);border-color:var(--pri)}
textarea{min-height:76px;resize:vertical}.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto;min-height:auto}
.pw{display:flex;gap:6px}.pw input{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px var(--font);cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.55;pointer-events:none}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.acc{background:var(--acc);border-color:var(--acc);color:#1b1b1b}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--bd))}.btn.block{width:100%;margin-top:14px}.btn.sm,.ghost.sm{min-height:32px;padding:5px 10px;font-size:12px}
.ghost{background:transparent;border:1px solid var(--bd);border-radius:10px;cursor:pointer;color:var(--tx)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:color-mix(in srgb,var(--tx) 7%,transparent)}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
#app{min-height:100%}
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--pri);color:#fff;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top)}
.hd-logo{width:36px;height:36px;border-radius:9px;object-fit:contain;background:rgba(255,255,255,.12);cursor:zoom-in}
.hd-title{display:flex;flex-direction:column;min-width:0;flex:1}.hd-title b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd-title small{opacity:.8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-right{display:flex;align-items:center;gap:6px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.6);cursor:pointer;background:#ffffff33}
.org-sel{min-height:34px;padding:4px 8px;max-width:180px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}.org-sel option{color:#111}
.badge{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(255,255,255,.16)}
#side{position:fixed;top:var(--hdr);bottom:0;left:0;width:var(--side);background:var(--card);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 8px 30px;z-index:25;transition:transform .2s}
#side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 10px 4px}
#side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:500;cursor:pointer}
#side a:hover{background:color-mix(in srgb,var(--pri) 8%,transparent)}#side a.on{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri2);font-weight:700}
[data-mode=dark] #side a.on{color:#8fd1a6}
#view{margin-left:var(--side);padding:calc(var(--hdr) + 16px) 20px 40px;min-height:100vh;outline:none}
#view.full{padding:var(--hdr) 0 0}
#drawerMask{display:none}
#bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:28;padding-bottom:env(safe-area-inset-bottom)}
#bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);text-decoration:none;cursor:pointer}
#bottom a.on{color:var(--pri2);font-weight:700}
.only-mobile{display:none}
@media (min-width:901px){#bottom{display:none!important}}
@media (max-width:900px){
  .only-mobile{display:flex}#side{transform:translateX(-105%);box-shadow:var(--sh);width:280px}#side.open{transform:none}
  #drawerMask.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:24}
  #view{margin-left:0;padding:calc(var(--hdr) + 12px) 12px 84px}#view.full{padding:var(--hdr) 0 62px}
  .org-sel{max-width:110px}.hide-m{display:none!important}
}
@media (max-width:600px){#hdr .org-sel{display:none!important}#netBadge .nb-t{display:none}.hd-right{gap:2px}
}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.kpi{display:flex;gap:12px;align-items:center}.kpi .ki{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri2)}
.kpi b{font-size:22px;display:block}.kpi span{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.vh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.vh h2{margin:0;flex:1;min-width:160px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}.tabs button{border:0;background:none;padding:10px 12px;font:600 13px var(--font);color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri2);border-bottom-color:var(--pri)}
/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{position:sticky;top:0;background:color-mix(in srgb,var(--pri) 7%,var(--card));text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}.tbl tr:hover td{background:color-mix(in srgb,var(--pri) 4%,transparent)}.tbl td.num,.tbl th.num{text-align:right}
.cards .it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.cards .it .t{font-weight:600}.cards .it .m{color:var(--mut);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:color-mix(in srgb,var(--mut) 15%,transparent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#a06700}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}.pill.info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px}
.empty{text-align:center;padding:30px;color:var(--mut)}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--bd),color-mix(in srgb,var(--bd) 40%,var(--card)),var(--bd));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* modal */
.mdl-mask{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;animation:fi .12s}
.mdl{background:var(--card);border-radius:18px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mdl.wide{max-width:980px}.mdl-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}.mdl-h h3{flex:1;margin:0}
.mdl-b{padding:14px 16px;overflow:auto}.mdl-f{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:600px){.mdl-mask{padding:0;align-items:flex-end}.mdl{max-height:94vh;border-radius:18px 18px 0 0}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.form-grid .full{grid-column:1/-1}@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.req::after{content:' *';color:var(--bad)}
/* toast */
#toasts{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none;width:min(92vw,420px)}
.toast{background:#18241d;color:#fff;padding:11px 14px;border-radius:12px;box-shadow:var(--sh);font-size:13px;animation:fi .15s;pointer-events:auto}
.toast.ok{border-left:4px solid #4cc27a}.toast.bad{border-left:4px solid #ff6b5b}.toast.warn{border-left:4px solid #f0b429}
/* lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:95;touch-action:none}.lb-stage{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gal figure{position:relative}.gal .med-ed{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.92);border-radius:8px;min-height:30px;padding:3px 6px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--pri2);border-radius:10px;padding:6px 10px;margin-bottom:8px;position:sticky;top:0;z-index:5}.selbar .btn{min-height:32px}input.selc{width:18px;height:18px;min-height:0;margin:0;cursor:pointer}.tbl tr.sel td{background:rgba(47,122,75,.10)}
#lbImg{max-width:92vw;max-height:84vh;transform-origin:center;transition:transform .05s;user-select:none;-webkit-user-drag:none}
.lb-bar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.lb-bar button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer}
/* map */
#mapWrap{position:relative;height:calc(100vh - var(--hdr));isolation:isolate;z-index:0}@media (max-width:900px){#mapWrap{height:calc(100vh - var(--hdr) - 62px)}}
#map{position:absolute;inset:0}
.map-panel{position:absolute;z-index:500;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:10px}
.map-tools{top:10px;right:10px;display:flex;flex-direction:column;gap:6px;padding:6px;max-height:calc(100% - 20px - var(--sbh,0px));overflow-y:auto}
.map-tools button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center}
.map-tools button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.map-layers{top:10px;left:56px;max-width:min(320px,calc(100vw - 120px));max-height:calc(100% - 20px);overflow:auto;font-size:13px}
.map-layers label{display:flex;gap:6px;align-items:center;margin:4px 0;font-weight:400}.map-layers input[type=checkbox],.map-layers input[type=radio]{width:auto;min-height:auto}
.survey-bar{left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px}
#mapWrap .survey-bar{z-index:1001}#mapWrap:has(>.survey-bar:not(:empty):not(.hidden)) .leaflet-bottom{margin-bottom:var(--sbh,112px);transition:margin .2s}
.survey-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.survey-stats b{display:block;font-size:16px}.survey-stats span{font-size:11px;color:var(--mut)}
.acc-good{color:var(--ok)}.acc-mid{color:var(--warn)}.acc-bad{color:var(--bad)}
.leaflet-container{font:inherit}.leaflet-popup-content{margin:10px 12px;font-size:13px}.pop-t{font-weight:700;margin-bottom:4px}.pop-r{display:flex;justify-content:space-between;gap:12px}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - var(--hdr) - 150px);min-height:380px}
.chat-log{flex:1;overflow:auto;padding:6px}.msg{max-width:85%;padding:10px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap}
.msg.u{margin-left:auto;background:var(--pri);color:#fff;border-bottom-right-radius:4px}.msg.a{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.msg .src{font-size:11px;opacity:.7;margin-top:6px}.chat-in{display:flex;gap:6px;padding-top:8px}.chat-in textarea{min-height:44px;height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--tx)}
.timeline{border-left:2px solid var(--bd);margin-left:6px;padding-left:14px}.tl{position:relative;margin-bottom:12px}.tl::before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.gal figure{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--bd);cursor:zoom-in;background:var(--bd)}
.gal img{width:100%;height:100px;object-fit:cover;display:block}.gal figcaption{font-size:11px;padding:4px 6px;color:var(--mut)}
.qa li{margin:6px 0}.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;border:1px solid rgba(0,0,0,.15)}
.legend-ed .lr{display:grid;grid-template-columns:28px 1fr 90px 34px;gap:6px;align-items:center;margin:4px 0}.legend-ed input[type=color]{padding:0;height:34px;min-height:34px}
.theme-sw{display:flex;gap:8px;flex-wrap:wrap}.theme-sw button{width:42px;height:42px;border-radius:12px;border:3px solid transparent;cursor:pointer}.theme-sw button.on{border-color:var(--tx)}
.progress{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.progress i{display:block;height:100%;background:var(--pri)}
.legal h3{margin-top:16px}.legal p,.legal li{font-size:13px}
@media print{#hdr,#side,#bottom,.vh .btn{display:none!important}#view{margin:0;padding:0}}
</style>

</head>

function api(action, payload, opt) {

  list: function (ent, force) {

var Router = {
  views: {}, exitArmed: 0,
  reg: function (name, def) { Router.views[name] = def; },
  hist: function () { return (window.google && google.script && google.script.history) ? google.script.history : null; },
  push: function (state) {
    var h = Router.hist();
    if (h) h.push(state, {}, state.v || ''); else history.pushState(state, '', '#' + (state.v || ''));
  },
  init: function () {
    var handler = function (st) {
      if (UI._skipPop) { UI._skipPop = false; return; }
      if (S.modalDepth > 0) { UI.closeTopModal(true); return; }
      if (UI.lbOpen) { UI.zoomClose(true); return; }
      if ($('#side').classList.contains('open')) { UI.drawer(false); }
      if (!st || !st.v || st.v === '__root') {
        if (Date.now() - Router.exitArmed < 2200) { var h = Router.hist(); if (!h) history.back(); return; }
        Router.exitArmed = Date.now(); UI.toast('Tekan Kembali sekali lagi untuk keluar', 'warn');
        Router.push({ v: S.view || 'dashboard', p: S.params || {} });
        return;
      }
      if (st.v === S.view && JSON.stringify(st.p || {}) === JSON.stringify(S.params || {})) return; // entri duplikat
      Router.render(st.v, st.p || {});
    };
    var h = Router.hist();
    if (h) h.setChangeHandler(function (e) { handler(e.state); });
    else window.addEventListener('popstate', function (e) { handler(e.state); });
    if (h) h.replace({ v: '__root' }, {}, ''); else history.replaceState({ v: '__root' }, '', location.pathname + location.search);
  },
  go: function (name, params, opt) {

    if (!Router.views[name]) name = 'dashboard';
    if (!opt.replace) Router.push({ v: name, p: params || {} });
    Router.render(name, params || {});
  },
  render: function (name, params) {
    var def = Router.views[name] || Router.views.dashboard;
    if (def.perm && !can(def.perm, 'R')) { def = Router.views.dashboard; name = 'dashboard'; }
    if (S.view && Router.views[S.view] && Router.views[S.view].leave) try { Router.views[S.view].leave(); } catch (e) {}

var CSV = { parse: function (txt) {

  var sep = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';
  var split = function (l) { var out = [], cur = '', q = false; for (var i = 0; i < l.length; i++) { var c = l[i]; if (c === '"') { if (q && l[i + 1] === '"') { cur += '"'; i++; } else q = !q; } else if (c === sep && !q) { out.push(cur); cur = ''; } else cur += c; } out.push(cur); return out.map(function (s) { return s.trim(); }); };
  var head = split(lines[0]).map(function (h) { return h.toLowerCase(); });
  return lines.slice(1).map(function (l) { var v = split(l), o = {}; head.forEach(function (h, i) { if (v[i] !== undefined && v[i] !== '') o[h] = /^(lat|lng|row_no|tree_no|qty|price|acc)$/.test(h) ? Number(String(v[i]).replace(',', '.')) : v[i]; }); return o; });
} };

    '<h3>4. Rekomendasi AI & agronomi</h3><p>Jawaban, indikasi penyakit/hama dari foto, prediksi produksi, dan rekomendasi AI bersifat pendukung keputusan dan dapat keliru. Keputusan penggunaan pupuk, pestisida, dan tindakan budidaya tetap menjadi tanggung jawab pengguna dan wajib mengikuti label produk, ketentuan yang berlaku, serta arahan agronomis/penyuluh.</p>' +
    '<h3>5. Data & kepemilikan</h3><p>Data yang dimasukkan adalah milik Organisasi pengguna. Penyedia memproses data hanya untuk menjalankan layanan. Pengguna bertanggung jawab atas kebenaran data dan telah memperoleh persetujuan petani yang datanya dicatat.</p>' +
    '<h3>6. Penggunaan yang dilarang</h3><p>Dilarang memasukkan data palsu, mengakses data organisasi/petani lain tanpa hak, merekayasa balik, membagikan lisensi, atau memakai Aplikasi untuk kegiatan melanggar hukum.</p>' +
    '<h3>7. Lisensi & ketersediaan</h3><p>Fitur dan kapasitas mengikuti paket lisensi. Saat lisensi berakhir, Aplikasi beralih ke mode baca-saja; data tetap dapat dilihat dan diekspor. Layanan berjalan di atas infrastruktur Google (Apps Script, Sheets, Drive) sehingga tunduk pada kuota dan ketersediaan layanan tersebut.</p>' +
    '<h3>8. Batasan tanggung jawab</h3><p>Sepanjang diizinkan hukum, Penyedia tidak bertanggung jawab atas kerugian tidak langsung akibat kesalahan input, gangguan jaringan, atau keputusan yang diambil berdasarkan keluaran Aplikasi.</p>' +
    '<h3>9. Perubahan & hukum</h3><p>Ketentuan dapat diperbarui dan akan diberitahukan melalui Aplikasi. Ketentuan ini tunduk pada hukum Republik Indonesia.</p>' +
    '<p class="tiny muted">Template ini perlu ditinjau dan disesuaikan oleh penasihat hukum Penyedia/Organisasi sebelum digunakan secara komersial.</p></div>'; },
  privacy: function () { return '<div class="legal"><p class="tiny muted">Pemberitahuan Privasi sesuai UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi · diperbarui ' + Legal.updated + '</p>' +
    '<h3>Pengendali & prosesor</h3><p>Organisasi pengguna (koperasi/kelompok/perusahaan) bertindak sebagai <b>Pengendali Data Pribadi</b>. Penyedia aplikasi bertindak sebagai <b>Prosesor</b> yang memproses data atas instruksi Pengendali.</p>' +
    '<h3>Data yang diproses</h3><ul><li>Identitas & kontak: nama, nomor anggota internal, jenis kelamin, tahun lahir, desa/alamat, telepon, foto profil.</li><li>Data lahan: lokasi & batas kebun (koordinat), relasi penguasaan lahan, referensi dokumen.</li><li>Data usaha: inventaris pohon, aktivitas, panen, harga, biaya, transaksi keuangan.</li><li>Dokumentasi: foto/video beserta lokasi & waktu pengambilan.</li><li>Data akun & log: username, peran, waktu login, jejak audit perubahan data.</li></ul>' +
    '<p>Aplikasi tidak meminta NIK/KTP secara default. Bila Organisasi menambahkan dokumen identitas, dokumen tersebut termasuk data yang perlu perlindungan ekstra.</p>' +
    '<h3>Tujuan & dasar pemrosesan</h3><p>Pengelolaan anggota dan kebun, pemetaan & inventarisasi, pencatatan produksi dan keuangan, pelaporan kepada pengelola organisasi, serta analisis pendukung keputusan. Dasar pemrosesan: <b>persetujuan eksplisit</b> petani (dicatat pada data petani) dan/atau pelaksanaan perjanjian keanggotaan/kemitraan.</p>' +
    '<h3>Lokasi</h3><p>GPS digunakan hanya saat Anda membuka fitur ukur lahan, ikuti posisi, atau mengambil foto/titik. Aplikasi tidak melacak lokasi di latar belakang.</p>' +
    '<h3>Pihak ketiga</h3><ul><li>Google (Apps Script, Sheets, Drive) sebagai infrastruktur penyimpanan.</li><li>Penyedia peta dasar (OpenStreetMap, Esri, OpenTopoMap) menerima permintaan tile peta (tanpa data petani).</li><li>Penyedia AI (bila diaktifkan admin): menerima ringkasan agregat & foto yang Anda pilih untuk dianalisis.</li></ul><p>Data tidak dijual kepada pihak mana pun.</p>' +
    '<h3>Penyimpanan & keamanan</h3><p>Akses dibatasi per organisasi dan per peran (RBAC); petani hanya melihat datanya sendiri. Password disimpan dalam bentuk hash; file foto disimpan privat; setiap perubahan dicatat di audit log. Data disimpan selama keanggotaan aktif dan sesuai kebijakan retensi Organisasi, kemudian dihapus atau dianonimkan.</p>' +
    '<h3>Hak subjek data</h3><p>Anda berhak memperoleh informasi, mengakses, memperbaiki, meminta salinan, menghapus/memusnahkan, menarik persetujuan, dan mengajukan keberatan atas pemrosesan. Ajukan melalui admin Organisasi Anda. Penarikan persetujuan tidak memengaruhi pemrosesan yang telah dilakukan sebelumnya.</p>' +
    '<h3>Insiden</h3><p>Bila terjadi kegagalan pelindungan data, Pengendali akan memberitahukan subjek data dan lembaga terkait paling lambat 3 × 24 jam sesuai UU PDP.</p>' +
    '<h3>Kontak</h3><p>Pertanyaan privasi: hubungi admin Organisasi Anda atau Penyedia melalui kontak pada halaman Tentang.</p>' +
    '<p class="tiny muted">Template — Organisasi wajib melengkapi identitas Pengendali, kontak pejabat pelindungan data (bila diwajibkan), dan kebijakan retensi.</p></div>'; },

};

    '<div class="card"><h3>Riwayat versi</h3><p><b>1.3.0</b> — peta: info lengkap bidang saat diklik (luas, keliling, petani, kebun, jumlah pohon) &amp; tombol Zoom ke bidang / layer / foto udara; Data Pohon: pilih banyak sekaligus, hapus terpilih, geser posisi pohon di peta (seret atau panah per 0,2–5 m, cocok untuk foto udara); foto: ubah kategori/keterangan &amp; hapus foto salah unggah.</p><p><b>1.2.1</b> — perbaikan: peta tidak error bila ada laporan hama tanpa koordinat; kode pohon otomatis (grid tanam / impor SHP) melanjutkan nomor terbesar sehingga tidak bentrok; ekspor GeoJSON tanpa fitur kosong; siap pindah foto ke Supabase.</p><p><b>1.2.0</b> — impor/ekspor Shapefile (SHP) di peta, impor/ekspor Excel di semua tabel data, pratinjau grid tanam langsung di peta, perbaikan simpan grid &amp; unggah foto/video/PDF untuk Super Admin, label koordinat cetak peta tidak terpotong, tombol Tes koneksi AI.</p><p><b>1.1.0</b> — layer foto udara drone PMTiles (online URL &amp; offline file besar), ortho ikut tercetak di PDF, menu Mode Lapangan, tombol mengambang PWA dapat digeser/diciutkan/disembunyikan.</p><p><b>1.0.0</b> (' + esc(a.build) + ') — rilis awal: multi-tenant RBAC, survei GPS/GNSS/RTK, peta GIS, digital tree + QR, dokumentasi, operasional, panen, inventori, keuangan double-entry, AI assistant, cetak peta PDF, PWA offline.</p>' +
